# shipfloor on Shipfloor V0, the software factory (https://github.com/kennedykjj/shipfloor).
# Read from origin/main only; agents may never change this directory.
project:
  name: shipfloor
  repo: kennedykjj/shipfloor
board: {owner: kennedykjj, number: 4}
language: pt-BR
context: [PRODUCT.md, ARCHITECTURE.md, DESIGN.md, CLAUDE.md]
review_criteria: .shipfloor/review-criteria.md
# build-logic/ and the wrapper hold the test conventions (#2): implementers do not touch them.
forbidden: [build-logic/, gradle/wrapper/, .github/]
acceptance_assertions: 'assert|assertThat|assertEquals|@Disabled|@Ignore|@Test\(enabled'
# 0 = sem limite de WIP no projeto (sem o bloco, valem os padrões da fábrica: refine 2, develop 4).
# Quantos runs rodam ao mesmo tempo continua limitado pelo pool da máquina (~/.shipfloor/config.yml).
# Teto de custo da shipfloor (estimativa pela tabela de preços, em US$). Sem ele o dispatcher da shipfloor não lança.
# Decidido pelo dono em 2026-10-16 para a primeira semana da Virada; rever depois de medir.
cost:
  per_card_usd: 30
  per_day_usd: 300
limits:
  refine: {wip: 0}
  develop: {wip: 0}
layers:
  - name: core
    path: core/
    stack: Kotlin, sem IO (puro)
    build: ../gradlew :core:build --console=plain
    test: ../gradlew :core:test --tests {selector} --rerun --console=plain
    ran: 'PASSED'
    tests: ['core/src/test/**']
  - name: store
    path: store/
    stack: Kotlin, SQLite
    build: ../gradlew :store:build --console=plain
    test: ../gradlew :store:test --tests {selector} --rerun --console=plain
    ran: 'PASSED'
    tests: ['store/src/test/**']
  - name: ports
    path: ports/
    stack: Kotlin, interfaces
    build: ../gradlew :ports:build --console=plain
    test: ../gradlew :ports:test --tests {selector} --rerun --console=plain
    ran: 'PASSED'
    tests: ['ports/src/test/**']
  - name: adapters
    path: adapters/
    stack: Kotlin, runtimes e forge
    build: ../gradlew :adapters:build --console=plain
    test: ../gradlew :adapters:test --tests {selector} --rerun --console=plain
    ran: 'PASSED'
    tests: ['adapters/src/test/**']
  - name: daemon
    path: daemon/
    stack: Kotlin, JVM, MCP e dispatcher
    build: ../gradlew :daemon:build --console=plain
    test: ../gradlew :daemon:test --tests {selector} --rerun --console=plain
    ran: 'PASSED'
    tests: ['daemon/src/test/**']
  - name: cli
    path: cli/
    stack: Kotlin, Clikt
    build: ../gradlew :cli:build --console=plain
    test: ../gradlew :cli:test --tests {selector} --rerun --console=plain
    ran: 'PASSED'
    tests: ['cli/src/test/**']
  - name: app
    path: app/
    stack: Kotlin, Compose Multiplatform
    build: ../gradlew :app:build --console=plain
    test: ../gradlew :app:test --tests {selector} --rerun --console=plain
    ran: 'PASSED'
    tests: ['app/src/test/**']
  - name: e2e
    path: e2e/
    tests_only: true
    stack: Kotlin, JUnit 5 contra o daemon
    test: ../gradlew :e2e:test --tests {selector} --rerun --console=plain
    ran: 'PASSED'
    tests: ['e2e/src/test/**']
deploy:
  ci_workflow: CI
  timeout_min: 30
