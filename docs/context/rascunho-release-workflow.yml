# RASCUNHO do #72 (pacotes deb e rpm). Não funciona sozinho e não está em .github/.
# Para valer: (1) copiar para .github/workflows/release.yml, à mão (o token do gh não tem o escopo
# `workflow`; empurrar por SSH ou `gh auth refresh -s workflow`); (2) configurar o empacotamento em
# app/build.gradle.kts, que hoje não tem `nativeDistributions` (card de camada `app`, a fábrica pode fazer).
#
# ATENÇÃO ao critério 2 do #72, "instalação por usuário": deb e rpm instalam no sistema e pedem root
# (dpkg -i, rpm -i). Por usuário, sem root, é tar.gz ou AppImage. Decidir antes de seguir.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Ferramentas de empacotamento do rpm
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - uses: gradle/actions/setup-gradle@v4
      # Tarefas do Compose Multiplatform; o JRE é embutido pelo jpackage.
      # Pressupõe, em app/build.gradle.kts:
      #   compose.desktop.application.nativeDistributions {
      #     targetFormats(TargetFormat.Deb, TargetFormat.Rpm)
      #     packageName = "shipfloor"
      #   }
      - run: ./gradlew :app:packageDeb :app:packageRpm --console=plain
      - name: Publicar no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes \
            app/build/compose/binaries/main/deb/*.deb \
            app/build/compose/binaries/main/rpm/*.rpm
